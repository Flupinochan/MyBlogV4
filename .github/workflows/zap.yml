name: ZAP
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zap:
    name: ZAP Baseline
    runs-on: ubuntu-latest
    steps:
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://metalmental.net/
          allow_issue_writing: false
